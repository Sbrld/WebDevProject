<div class="container">
  <div class="form-card">
    <div class="form-header">
      <h2>📝 Add New Item</h2>
      <p>Fill in the details about the lost or found item</p>
    </div>

    @if (errorMessage) {
      <div class="error">⚠️ {{ errorMessage }}</div>
    }

    <div class="form-group">
      <label>Title</label>
      <input [(ngModel)]="formData.title" name="title" placeholder="e.g. Black iPhone 14 Pro" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea [(ngModel)]="formData.description" name="description" placeholder="Describe the item in detail..." rows="4"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <select [(ngModel)]="formData.category" name="category">
          <option value="">Select...</option>
          <option value="phone">📱 Phone</option>
          <option value="keys">🔑 Keys</option>
          <option value="documents">📄 Documents</option>
          <option value="backpack">🎒 Backpack</option>
          <option value="clothes">👕 Clothes</option>
          <option value="other">📦 Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="formData.status" name="status">
          <option value="lost">🔴 Lost</option>
          <option value="found">🟢 Found</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Location</label>
        <input [(ngModel)]="formData.location" name="location" placeholder="📍 Where?" />
      </div>

      <div class="form-group">
        <label>Date</label>
        <input [(ngModel)]="formData.date" name="date" type="date" />
      </div>
    </div>

    <div class="form-group">
      <label>Image (optional)</label>
      <div class="file-input-wrapper">
        <input type="file" accept="image/*" (change)="onImageChange($event)" />
        <p class="file-hint">PNG, JPG up to 10MB</p>
      </div>
    </div>

    <button class="btn-submit" (click)="onSubmit()" [disabled]="loading">
      @if (loading) { ⏳ Saving... } @else { 🚀 Add Item }
    </button>
  </div>
</div>
