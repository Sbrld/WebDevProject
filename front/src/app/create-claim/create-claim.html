<div class="overlay" (click)="close()"></div>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="form-title">
  <div class="modal-header">
    <h2 id="form-title">New Claim</h2>
    <button class="close-btn" (click)="close()" aria-label="Close">&times;</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="title">Title <span class="required">*</span></label>
      <input id="title" type="text" formControlName="title" placeholder="What was lost or found?" />
      @if (form.get('title')?.invalid && form.get('title')?.touched) {
        <span class="field-error">Title is required.</span>
      }
    </div>

    <div class="field">
      <label for="status">Status <span class="required">*</span></label>
      <select id="status" formControlName="status">
        @for (opt of statusOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="category">Category</label>
      <input id="category" type="text" formControlName="category" placeholder="e.g. Electronics, Wallet…" />
    </div>

    <div class="field">
      <label for="location">Location</label>
      <input id="location" type="text" formControlName="location" placeholder="Where?" />
    </div>

    <div class="field">
      <label for="date">Date</label>
      <input id="date" type="date" formControlName="date" />
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" rows="3" placeholder="Additional details…"></textarea>
    </div>

    @if (error) {
      <p class="submit-error">{{ error }}</p>
    }

    <div class="actions">
      <button type="button" class="btn-secondary" (click)="close()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="submitting">
        {{ submitting ? 'Saving…' : 'Submit Claim' }}
      </button>
    </div>
  </form>
</div>
