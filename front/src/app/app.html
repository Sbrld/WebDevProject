<header class="app-header">
  <span class="app-title">{{ title() }}</span>
  <button class="btn-new-claim" (click)="openForm()">+ New Claim</button>
</header>

<main class="app-main">
  <!-- Claims list (rendered by router, lives on the claims-list branch) -->
  <router-outlet />
</main>

@if (showForm) {
  <app-create-claim (closed)="onFormClosed($event)" />
}
